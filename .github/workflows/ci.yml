name: C CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            check 

      - name: Configure
        run: cmake -G Ninja -B build -S .

      - name: Build
        run: ninja -C build

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

